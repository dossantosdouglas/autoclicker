<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="mouseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#deddda"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ec27e"/>
      <stop offset="100%" stop-color="#26a269"/>
    </linearGradient>
  </defs>

  <!-- Fundo com cantos arredondados estilo GNOME -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)"/>

  <!-- Corpo do Mouse -->
  <rect x="36" y="28" width="56" height="76" rx="28" fill="url(#mouseGrad)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.25))"/>

  <!-- Linha divisória dos botões -->
  <line x1="64" y1="30" x2="64" y2="58" stroke="#9a9996" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 40 58 Q 64 62 88 58" fill="none" stroke="#c0bfbc" stroke-width="2"/>

  <!-- Botão esquerdo destacado (clicado) -->
  <path d="M 37 54 C 37 38 48 30 63 30 L 63 58 C 50 58 40 57 37 54 Z" fill="#3584e4" opacity="0.18"/>

  <!-- Rodinha de Scroll -->
  <rect x="61" y="38" width="6" height="14" rx="3" fill="#5e5c64"/>

  <!-- Ondas de clique (Efeito de clique) -->
  <path d="M 28 36 C 24 44 24 54 28 62" fill="none" stroke="#f6d32d" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 20 30 C 14 44 14 62 20 72" fill="none" stroke="#f6d32d" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Distintivo de Relógio / Temporizador -->
  <circle cx="88" cy="88" r="22" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="3"/>
  <circle cx="88" cy="88" r="17" fill="#ffffff"/>
  <!-- Ponteiros do relógio -->
  <line x1="88" y1="88" x2="88" y2="76" stroke="#26a269" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="88" y1="88" x2="96" y2="88" stroke="#26a269" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="88" cy="88" r="2.5" fill="#26a269"/>
</svg>
